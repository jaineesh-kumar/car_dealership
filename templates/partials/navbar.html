<header x-data="{ scrolled: false }" 
        @scroll.window="scrolled = (window.pageYOffset > 20)" 
        :class="{ 'bg-surface/80 backdrop-blur-md border-b border-border': scrolled, 'bg-transparent border-transparent': !scrolled }"
        class="fixed top-0 w-full z-50 transition-all duration-300 border-b">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center h-20">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a href="/" class="font-heading text-2xl tracking-tighter text-text">
                    MARLOW<span class="text-accent">MOTORS</span>
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-8">
                <a href="{% url 'inventory' %}" class="text-muted hover:text-text px-3 py-2 text-sm font-medium transition-colors">Inventory</a>
                <a href="{% url 'sell_trade' %}" class="text-muted hover:text-text px-3 py-2 text-sm font-medium transition-colors">Sell / Trade</a>
                <a href="{% url 'about' %}" class="text-muted hover:text-text px-3 py-2 text-sm font-medium transition-colors">About</a>
                <a href="{% url 'contact' %}" class="text-muted hover:text-text px-3 py-2 text-sm font-medium transition-colors">Contact</a>
            </nav>
            
            <div class="hidden md:flex items-center space-x-4">
                <a href="{% url 'contact' %}" class="btn-ghost py-2 px-4 text-sm">
                    Book Test Drive
                </a>
            </div>
            
            <!-- Mobile menu button -->
            <div class="flex items-center md:hidden" x-data="{ mobileMenuOpen: false }">
                <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="text-text hover:text-accent focus:outline-none p-2">
                    <span class="sr-only">Open main menu</span>
                    <i data-lucide="menu" x-show="!mobileMenuOpen"></i>
                    <i data-lucide="x" x-show="mobileMenuOpen" x-cloak></i>
                </button>
            </div>
        </div>
    </div>
</header>
